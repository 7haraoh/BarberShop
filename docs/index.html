<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentação · Barbearia Financeiro</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --bg: #0c0c0c; --surface: #161616; --line: rgba(255,255,255,.1); --text: #f0efec; --muted: #a9a59b; --gold: #c9a227; --gold-2: #e0bd52; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.65 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    header { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: rgba(12,12,12,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    header b { color: var(--gold-2); }
    header a { color: #141006; background: var(--gold); padding: 7px 14px; border-radius: 9px; font-weight: 600; text-decoration: none; white-space: nowrap; }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
    h1, h2, h3 { line-height: 1.25; }
    h1 { font-size: 30px; margin-top: 8px; }
    h2 { margin-top: 36px; padding-bottom: 6px; border-bottom: 1px solid var(--line); color: var(--gold-2); }
    a { color: var(--gold-2); }
    code { background: #222; padding: 2px 6px; border-radius: 5px; font-size: .9em; }
    pre { background: var(--surface); border: 1px solid var(--line); padding: 14px; border-radius: 10px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    blockquote { margin: 0; padding: 8px 14px; border-left: 3px solid var(--gold); background: var(--surface); color: var(--muted); border-radius: 0 8px 8px 0; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: var(--surface); }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <header><b>Barbearia Financeiro · Documentação</b><a href="../">Abrir o app</a></header>
  <main id="doc"><p class="muted">Carregando…</p></main>
  <script src="marked.min.js"></script>
  <script>
    fetch('README.md', { cache: 'no-cache' })
      .then((r) => (r.ok ? r.text() : Promise.reject(r.status)))
      .then((md) => {
        const el = document.getElementById('doc');
        el.innerHTML = window.marked ? marked.parse(md) : '<pre></pre>';
        if (!window.marked) el.querySelector('pre').textContent = md;
        el.querySelectorAll('table').forEach((t) => {
          const w = document.createElement('div');
          w.className = 'table-wrap';
          t.replaceWith(w);
          w.appendChild(t);
        });
      })
      .catch(() => {
        document.getElementById('doc').innerHTML = '<p>Não foi possível carregar a documentação. <a href="https://github.com/7haraoh/BarberShop/blob/main/docs/README.md">Ver no GitHub</a>.</p>';
      });
  </script>
</body>
</html>
