<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="color-scheme" content="dark">
  <title>Barbearia Financeiro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a href="#main" class="skip-link">Pular para o conteúdo</a>
  <aside class="sidebar" aria-label="Menu principal">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect x="11" y="3" width="10" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 9 21 14M11 15l10 5M11 21l10 5" stroke="currentColor" stroke-width="2"/></svg>
      </div>
      <div>
        <strong data-shop>Barbearia</strong>
        <span>Gestão financeira</span>
      </div>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot">
      <span class="muted small">Atalhos: <kbd>R</kbd> receita · <kbd>D</kbd> despesa</span>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <div class="shell">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn menu-btn" aria-label="Abrir menu">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title">
        <strong class="mobile-brand" data-shop>Barbearia</strong>
        <span id="today" class="muted"></span>
      </div>
      <div class="topbar-actions">
        <button id="btn-exp" class="btn btn-ghost btn-sm"><span aria-hidden="true">−</span> Despesa</button>
        <button id="btn-rev" class="btn btn-gold btn-sm"><span aria-hidden="true">+</span> Receita</button>
      </div>
    </header>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <nav id="bottom-nav" class="bottom-nav" aria-label="Navegação rápida"></nav>
  <div class="fab-wrap">
    <button id="fab-exp" class="fab-mini exp">Despesa</button>
    <button id="fab-rev" class="fab-mini rev">Receita</button>
    <button id="fab" class="fab" aria-label="Novo lançamento">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div id="modal-root" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/jspdf.umd.min.js" defer></script>
  <script src="vendor/jspdf.plugin.autotable.min.js" defer></script>
  <script src="vendor/exceljs.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
